name: Tag and release version

# When version.js changes on main, create the tag vX.Y.Z and a GitHub release for it
# (skipped if that tag already exists), so GitHub matches the version shown in the app.
on:
  push:
    branches: [main]
    paths: [version.js]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: |
          VERSION=$(grep -oP "APP_VERSION\s*=\s*'\K[0-9]+\.[0-9]+\.[0-9]+" version.js)
          test -n "$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, nothing to do"; exit 0
          fi
          NOTES=$(awk -v t="## $TAG" '$0 ~ "^## v" {p = index($0, t) == 1} p && !/^## v/' CHANGELOG.md)
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "${NOTES:-Release $TAG}"
